<svg width="500" height="420" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="420" fill="#1e1e1e"/>

  <!-- guide line -->
  <line x1="30" y1="60" x2="30" y2="380" stroke="#3a3a3a" stroke-width="1"/>

  <!-- backend (root, open folder, git-modified red dot) -->
  <g transform="translate(10,20)">
    <path d="M0 8 L8 8 L11 4 L26 4 L26 22 L0 22 Z" fill="#dcb67a"/>
    <circle cx="24" cy="6" r="4.5" fill="#f14c4c"/>
    <text x="34" y="19" fill="#ffffff" font-size="17" font-weight="500">backend</text>
  </g>

  <!-- __pycache__ (closed folder) -->
  <g transform="translate(40,58)">
    <path d="M0 6 L8 6 L11 3 L24 3 L24 19 L0 19 Z" fill="none" stroke="#c5c5c5" stroke-width="1.2"/>
    <text x="32" y="16" fill="#ffffff" font-size="16">__pycache__</text>
  </g>

  <!-- .gitignore -->
  <g transform="translate(40,96)">
    <path d="M2 2 a6 6 0 1 0 0.1 0 M2 2 l4 4" fill="none" stroke="#8b8b8b" stroke-width="1.3"/>
    <circle cx="2" cy="2" r="1.6" fill="#8b8b8b"/>
    <text x="32" y="16" fill="#ffffff" font-size="16">.gitignore</text>
  </g>

  <!-- main.py (python icon with warning) -->
  <g transform="translate(40,134)">
    <path d="M10 0 c-5 0 -5 3 -5 3 v3 h5 v1 h-7 c0 0 -3 0 -3 4.5 s3 4.5 3 4.5 h2 v-3 c0 0 0 -2.5 3 -2.5 h5 c0 0 2.5 0 2.5 -2.5 v-4.5 c0 0 0 -3.5 -5.5 -3.5 Z" fill="#3776ab" transform="translate(0,1) scale(0.9)"/>
    <path d="M10 20 c5 0 5 -3 5 -3 v-3 h-5 v-1 h7 c0 0 3 0 3 -4.5 s-3 -4.5 -3 -4.5 h-2 v3 c0 0 0 2.5 -3 2.5 h-5 c0 0 -2.5 0 -2.5 2.5 v4.5 c0 0 0 3.5 5.5 3.5 Z" fill="#ffd43b" transform="translate(0,1) scale(0.9)"/>
    <path d="M20 2 L26 12 L14 12 Z" fill="#e5c07b"/>
    <text x="20" y="10.5" text-anchor="middle" fill="#3a2f00" font-size="8" font-weight="700">!</text>
    <text x="42" y="16" fill="#ffffff" font-size="16">main.py</text>
  </g>

  <!-- package.json -->
  <g transform="translate(40,172)">
    <text x="0" y="15" fill="#cbcb41" font-size="16" font-family="monospace">{ }</text>
    <text x="32" y="16" fill="#ffffff" font-size="16">package.json</text>
  </g>

  <!-- Qwen.py (python icon with red error x) -->
  <g transform="translate(40,210)">
    <path d="M10 0 c-5 0 -5 3 -5 3 v3 h5 v1 h-7 c0 0 -3 0 -3 4.5 s3 4.5 3 4.5 h2 v-3 c0 0 0 -2.5 3 -2.5 h5 c0 0 2.5 0 2.5 -2.5 v-4.5 c0 0 0 -3.5 -5.5 -3.5 Z" fill="#3776ab" transform="translate(0,1) scale(0.9)"/>
    <path d="M10 20 c5 0 5 -3 5 -3 v-3 h-5 v-1 h7 c0 0 3 0 3 -4.5 s-3 -4.5 -3 -4.5 h-2 v3 c0 0 0 2.5 -3 2.5 h-5 c0 0 -2.5 0 -2.5 2.5 v4.5 c0 0 0 3.5 5.5 3.5 Z" fill="#ffd43b" transform="translate(0,1) scale(0.9)"/>
    <circle cx="21" cy="7" r="6" fill="#f14c4c"/>
    <path d="M18.5 4.5 L23.5 9.5 M23.5 4.5 L18.5 9.5" stroke="#ffffff" stroke-width="1.4"/>
    <text x="42" y="16" fill="#ffffff" font-size="16">Qwen.py</text>
  </g>

  <!-- requirements.txt -->
  <g transform="translate(40,248)">
    <path d="M0 3 h18 v14 h-18 Z M4 3 v14 M14 3 v14" fill="none" stroke="#8b8b8b" stroke-width="1.2"/>
    <text x="32" y="16" fill="#ffffff" font-size="16">requirements.txt</text>
  </g>
</svg>
